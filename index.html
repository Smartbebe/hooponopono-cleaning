<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --ib-1:#E6F4FB;
    --ib-2:#B9E1F2;
    --ib-3:#6EC1E4;
    --ib-4:#2E9BC9;
    --ib-deep:#125C7A;
    --text:#1E3A45;
    --sub:#5C7A85;
  }
  html,body{
    height:100%;
    font-family:'Noto Sans JP',sans-serif;
    background:linear-gradient(180deg,#F4FBFE 0%,#E6F4FB 100%);
    color:var(--text);
    overflow-x:hidden;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:20px 20px 40px;
  }
  header{
    text-align:center;
    padding:12px 0 20px;
  }
  header h1{
    font-size:20px;
    font-weight:700;
    color:var(--ib-deep);
    letter-spacing:1px;
  }
  header p{
    font-size:12px;
    color:var(--sub);
    margin-top:4px;
  }
  .theme-picker{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-bottom:24px;
  }
  .theme-btn{
    border:1.5px solid var(--ib-2);
    background:#fff;
    border-radius:14px;
    padding:10px 6px;
    font-size:12px;
    font-weight:500;
    color:var(--sub);
    cursor:pointer;
    transition:all .2s;
  }
  .theme-btn.active{
    border-color:var(--ib-4);
    background:var(--ib-1);
    color:var(--ib-deep);
    box-shadow:0 2px 8px rgba(46,155,201,0.25);
  }
  .card{
    background:#fff;
    border-radius:24px;
    box-shadow:0 4px 24px rgba(46,155,201,0.12);
    padding:32px 24px;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:420px;
    position:relative;
    overflow:hidden;
  }
  .screen{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .hidden{display:none !important;}

  .label{
    font-size:13px;
    color:var(--sub);
    margin-bottom:14px;
  }
  input#thought, textarea#thought{
    width:100%;
    max-width:280px;
    border:1.5px solid var(--ib-2);
    border-radius:12px;
    padding:12px 14px;
    font-size:15px;
    text-align:center;
    font-family:inherit;
    color:var(--text);
    margin-bottom:20px;
    outline:none;
    resize:none;
    line-height:1.6;
  }
  input#thought:focus{border-color:var(--ib-4);}
  button.primary{
    width:100%;
    max-width:280px;
    background:var(--ib-4);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    font-weight:500;
    font-family:inherit;
    cursor:pointer;
  }
  button.primary:active{transform:scale(0.98);}
  button.secondary{
    background:none;
    border:1.5px solid var(--ib-2);
    color:var(--ib-deep);
    border-radius:12px;
    padding:10px 24px;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
  }
  .hint{
    font-size:11px;
    color:var(--sub);
    margin:-12px 0 18px;
  }
  .thought-echo{
    font-size:12px;
    color:var(--sub);
    margin-bottom:18px;
    min-height:16px;
  }
  .done-title{
    font-size:14px;
    letter-spacing:2px;
    color:var(--sub);
    margin-bottom:4px;
  }
  .done-sub{
    font-size:22px;
    font-weight:700;
    color:var(--ib-deep);
    margin-bottom:24px;
  }
  .counter{
    font-size:11px;
    color:var(--sub);
    margin-top:18px;
  }

  /* ---- words theme ---- */
  .stamp-stage{
    width:220px;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .stamp-stage img{
    max-width:100%;
    max-height:100%;
    opacity:0;
    transition:opacity .5s ease;
    position:absolute;
  }
  .stamp-stage img.show{opacity:1;}

  /* ---- bubble theme ---- */
  @keyframes floatUp {
    0% { transform: translate(0,0) rotate(0deg); }
    30% { transform: translate(-10px,-60px) rotate(-3deg); }
    60% { transform: translate(8px,-115px) rotate(2deg); }
    100% { transform: translate(0,-170px) rotate(0deg); }
  }
  @keyframes popBurst {
    0% { transform: scale(1); opacity: 1; }
    15% { transform: scale(1.15); opacity: 1; }
    30% { transform: scale(1.15); opacity: 0; }
    100% { transform: scale(1.15); opacity: 0; }
  }
  @keyframes popRing {
    0% { transform: scale(0.9); opacity: 0.9; border-width: 3px; }
    100% { transform: scale(2.1); opacity: 0; border-width: 0.5px; }
  }
  .bubble-stage{
    position:relative;
    height:260px;
    width:100%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:visible;
  }
  .bubble-group{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    max-width:100%;
  }
  .bubble{
    position:relative;
    width:150px;
    height:150px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,0.85), rgba(255,255,255,0.12) 24%, rgba(170,215,238,0.18) 55%, rgba(120,190,225,0.14) 80%);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 18px;
    box-shadow:inset 0 0 26px rgba(255,255,255,0.4), inset -10px -10px 22px rgba(46,155,201,0.20), 0 4px 16px rgba(46,155,201,0.12);
  }
  .bubble span{
    font-size:14px;
    color:var(--ib-deep);
    font-weight:500;
  }
  .bubble-particles{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  /* ---- water theme ---- */
  @keyframes streak {
    0% { transform: translateY(-60px); opacity: 0; }
    15% { opacity: 0.7; }
    85% { opacity: 0.5; }
    100% { transform: translateY(280px); opacity: 0; }
  }
  @keyframes dissolve {
    0% { filter: blur(0px); opacity: 1; transform: translateY(0); }
    100% { filter: blur(4px); opacity: 0; transform: translateY(36px); }
  }
  @keyframes washDown {
    0% { height: 0%; opacity: 0.95; }
    100% { height: 100%; opacity: 0.95; }
  }
  .water-stage{
    position:relative;
    height:260px;
    width:100%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .water-streaks{position:absolute; inset:0;}
  #painted-text{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    position:relative;
    z-index:2;
    max-width:85%;
  }
  .painted-word{
    position:relative;
    display:inline-block;
    font-size:20px;
    font-weight:700;
    color:var(--ib-deep);
    font-family: 'Noto Sans JP', serif;
    line-height:1.5;
    padding:0 2px;
  }
  .wash-cover{
    position:absolute;
    top:0; left:0; right:0;
    height:0;
    background:#fff;
    border-bottom:2px solid var(--ib-3);
    box-shadow:0 2px 8px rgba(46,155,201,0.3);
    z-index:1;
  }
  .painted-word span{ position:relative; z-index:0; }

  /* ---- iceblue cloth theme ---- */
  @keyframes clothIn {
    0% { transform: scale(0.55); opacity:0; }
    65% { transform: scale(1.04); opacity:0.95; }
    100% { transform: scale(1); opacity:0.95; }
  }
  @keyframes wrapAway {
    0% { transform: scale(1); opacity:1; }
    100% { transform: scale(0.3); opacity:0; }
  }
  @keyframes textFadeIn {
    0% { opacity:0; }
    100% { opacity:1; }
  }
  .glow-stage{
    position:relative;
    height:260px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wrap-group{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 28px;
  }
  @keyframes clothRipple {
    0%, 100% { border-radius: 10px 14px 12px 16px; }
    50%      { border-radius: 14px 10px 16px 12px; }
  }
  @keyframes textFadeIn {
    0%   { opacity: 0; transform: translate3d(0, 6px, 0); }
    100% { opacity: 1; transform: translate3d(0, 0, 0); }
  }
  @keyframes textWipeOut {
    0%   { opacity: 1; filter: blur(0); }
    100% { opacity: 0; filter: blur(6px); }
  }

  .glow-stage {
    position: relative;
    width: 100%;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }

  .wrap-group {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 30px;
  }

  .glow-text {
    position: relative;
    z-index: 1;
    max-width: 200px;
    font-size: 15px;
    line-height: 1.7;
    font-weight: 500;
    color: var(--ib-deep);
    text-align: center;
    overflow-wrap: anywhere;
    opacity: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .glow-orb { animation: none !important; }
  }

  .dewdrop-mark{
    width:64px;
    height:74px;
    margin-bottom:16px;
  }

  /* ---- passcode gate ---- */
  #gate{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  #gate .dewdrop-mark{margin-bottom:20px;}
  #gate h2{
    font-size:17px;
    color:var(--ib-deep);
    margin-bottom:6px;
  }
  #gate p{
    font-size:12px;
    color:var(--sub);
    margin-bottom:20px;
  }
  #gate input{
    width:100%;
    max-width:260px;
    border:1.5px solid var(--ib-2);
    border-radius:12px;
    padding:12px 14px;
    font-size:15px;
    text-align:center;
    font-family:inherit;
    margin-bottom:12px;
    outline:none;
  }
  #gate input:focus{border-color:var(--ib-4);}
  #gate .error{
    font-size:12px;
    color:#D85A30;
    min-height:16px;
    margin-bottom:8px;
  }
</style>
</head>

<script>
/* 合言葉はここを書き換えてください（大文字小文字は区別しません） */
const PASSCODE = "わたしはわたし";

(function(){
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const input = document.getElementById('passcode');
  const btn = document.getElementById('gate-btn');
  const err = document.getElementById('gate-error');

  function unlock(){
    gate.classList.add('hidden');
    app.classList.remove('hidden');
  }

  if(localStorage.getItem('cleaning-auth') === 'true'){
    unlock();
  }

  function tryLogin(){
    const val = input.value.trim().toLowerCase();
    if(val === PASSCODE.toLowerCase()){
      localStorage.setItem('cleaning-auth', 'true');
      unlock();
    } else {
      err.textContent = '合言葉が違います';
      input.value = '';
      input.focus();
    }
  }
  btn.addEventListener('click', tryLogin);
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && !e.isComposing) tryLogin(); });
})();

const PHRASES = ["ごめんなさい","許してください","ありがとう","愛しています"];
const STAMP_IDS = ["img-sorry","img-forgive","img-thanks","img-love"];

let currentTheme = localStorage.getItem('cleaning-theme') || 'words';
let cleanCount = parseInt(localStorage.getItem('cleaning-count') || '0', 10);
let runSeq = 0;      // クリーニングのたびに増える通し番号
let currentRun = 0;  // 「今、有効な」通し番号

const els = {
  themeBtns: document.querySelectorAll('.theme-btn'),
  screenInput: document.getElementById('screen-input'),
  screenClean: document.getElementById('screen-clean'),
  screenDone: document.getElementById('screen-done'),
  thought: document.getElementById('thought'),
  startBtn: document.getElementById('start-btn'),
  resetBtn: document.getElementById('reset-btn'),
  counterText: document.getElementById('counter-text'),
  stageWords: document.getElementById('stage-words'),
  stageBubble: document.getElementById('stage-bubble'),
  stageWater: document.getElementById('stage-water'),
  stageIceblue: document.getElementById('stage-iceblue'),
  wordsEcho: document.getElementById('words-echo'),
};

function setTheme(t){
  currentTheme = t;
  localStorage.setItem('cleaning-theme', t);
  els.themeBtns.forEach(b=>{
    b.classList.toggle('active', b.dataset.theme === t);
  });
}
els.themeBtns.forEach(b=>{
  b.addEventListener('click', ()=>{
    runSeq++;
    currentRun = runSeq; // それまでの進行中クリーニングを無効化
    setTheme(b.dataset.theme);
    els.thought.value = '';
    els.screenDone.classList.add('hidden');
    els.screenClean.classList.add('hidden');
    els.screenInput.classList.remove('hidden');
  });
});
setTheme(currentTheme);

function showStage(name){
  [els.stageWords, els.stageBubble, els.stageWater, els.stageIceblue].forEach(s=>s.classList.add('hidden'));
  const map = {words: els.stageWords, bubble: els.stageBubble, water: els.stageWater, iceblue: els.stageIceblue};
  map[name].classList.remove('hidden');
}

function finish(myRun){
  if (myRun !== currentRun) return; // 別のタブに切り替え済みなら何もしない
  cleanCount += 1;
  localStorage.setItem('cleaning-count', String(cleanCount));
  setTimeout(()=>{
    if (myRun !== currentRun) return;
    els.screenClean.classList.add('hidden');
    els.screenDone.classList.remove('hidden');
    els.counterText.textContent = 'これまでに ' + cleanCount + ' 回クリーニングしました';

    setTimeout(()=>{
      if (myRun !== currentRun) return;
      if(!els.screenDone.classList.contains('hidden')){
        els.thought.value = '';
        els.screenDone.classList.add('hidden');
        els.screenInput.classList.remove('hidden');
      }
    }, 5000);
  }, 700);
}

/* ---- words theme runner ---- */
function runWords(val, onDone){
  let i = 0;
  STAMP_IDS.forEach(id => document.getElementById(id).classList.remove('show'));
  function step(){
    if(i > 0) document.getElementById(STAMP_IDS[i-1]).classList.remove('show');
    if(i >= STAMP_IDS.length){ onDone(); return; }
    document.getElementById(STAMP_IDS[i]).classList.add('show');
    i++;
    setTimeout(step, 1500);
  }
  step();
}

/* ---- bubble theme runner ---- */
function burst(cx, cy, container){
  for(let i=0;i<10;i++){
    const d = document.createElement('div');
    const angle = (Math.PI*2*i)/10;
    const dist = 45 + Math.random()*35;
    d.style.cssText = 'position:absolute; left:'+cx+'px; top:'+cy+'px; width:5px; height:5px; border-radius:50%; background:#2E9BC9; opacity:0.9; transition:transform .8s ease-out, opacity .8s ease-out;';
    container.appendChild(d);
    requestAnimationFrame(()=>{
      d.style.transform = 'translate('+Math.cos(angle)*dist+'px,'+Math.sin(angle)*dist+'px)';
      d.style.opacity = '0';
    });
    setTimeout(()=>d.remove(), 850);
  }
}
function burstShards(cx, cy, container){
  const count = 9;
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    const angle = (Math.PI*2*i)/count + (Math.random()*0.4 - 0.2);
    const dist = 55 + Math.random()*40;
    const size = 16 + Math.random()*12;
    const rotStart = Math.random()*360;
    const rotEnd = rotStart + (Math.random()*180 - 90);
    s.style.cssText = 'position:absolute; left:'+cx+'px; top:'+cy+'px; width:'+size+'px; height:'+size+'px; border-radius:50%; border:2px solid transparent; border-top-color:var(--ib-3); border-right-color:rgba(255,255,255,0.85); transform: translate(-50%,-50%) rotate('+rotStart+'deg); opacity:0.85; transition:transform .65s cubic-bezier(.2,.8,.3,1), opacity .65s ease-out;';
    container.appendChild(s);
    requestAnimationFrame(()=>{
      const tx = Math.cos(angle)*dist;
      const ty = Math.sin(angle)*dist;
      s.style.transform = 'translate(calc(-50% + '+tx+'px), calc(-50% + '+ty+'px)) rotate('+rotEnd+'deg) scale(0.4)';
      s.style.opacity = '0';
    });
    setTimeout(()=>s.remove(), 700);
  }
}
function popRing(cx, cy, container, size){
  size = size || 150;
  const r = document.createElement('div');
  r.style.cssText = 'position:absolute; left:'+cx+'px; top:'+cy+'px; width:'+size+'px; height:'+size+'px; margin-left:-'+(size/2)+'px; margin-top:-'+(size/2)+'px; border-radius:50%; border:3px solid var(--ib-3); animation: popRing 0.45s ease-out forwards;';
  container.appendChild(r);
  setTimeout(()=>r.remove(), 460);
}
function runBubble(items, onDone){
  const group = document.getElementById('bubble-group');
  const particles = document.getElementById('bubble-particles');
  const stage = document.getElementById('stage-bubble');
  group.innerHTML = '';
  particles.innerHTML = '';

  const list = items.length ? items : [''];
  const count = list.length;
  const size = count <= 2 ? 150 : count === 3 ? 122 : count <= 5 ? 100 : 82;
  const fontSize = size >= 130 ? 14 : size >= 100 ? 12 : 10;

  const bubbles = list.map(text=>{
    const b = document.createElement('div');
    b.className = 'bubble';
    b.style.width = size+'px';
    b.style.height = size+'px';
    b.style.opacity = '0';
    const span = document.createElement('span');
    span.textContent = text || '...';
    span.style.fontSize = fontSize+'px';
    b.appendChild(span);
    group.appendChild(b);
    return b;
  });

  void group.offsetWidth;
  bubbles.forEach(b=>{
    b.style.opacity = '1';
    b.style.animation = 'floatUp 2.6s ease-in-out forwards';
  });

  setTimeout(()=>{
    const stageRect = stage.getBoundingClientRect();
    bubbles.forEach(b=>{
      const r = b.getBoundingClientRect();
      const cx = r.left - stageRect.left + r.width/2;
      const cy = r.top - stageRect.top + r.height/2;
      popRing(cx, cy, particles, size);
      burstShards(cx, cy, particles);
      burst(cx, cy, particles);
      b.style.animation = 'popBurst 0.2s ease-out forwards';
    });
  }, 2600);

  setTimeout(()=>{
    bubbles.forEach(b=> b.style.opacity = '0');
    onDone();
  }, 3250);
}

/* ---- water theme runner ---- */
let waterTimer = null;
function spawnStreak(container){
  const s = document.createElement('div');
  const x = 10 + Math.random()*(container.clientWidth-10);
  const w = 1 + Math.random()*1.8;
  s.style.cssText = 'position:absolute; top:-60px; left:'+x+'px; width:'+w+'px; height:70px; background:#2E9BC9; animation: streak 1.15s linear forwards;';
  container.appendChild(s);
  setTimeout(()=>s.remove(), 1200);
}
function runWater(items, onDone){
  const paintedText = document.getElementById('painted-text');
  const streaksEl = document.getElementById('water-streaks');
  streaksEl.innerHTML = '';
  paintedText.innerHTML = '';

  const list = items.length ? items : ['...'];
  const words = list.map(text=>{
    const w = document.createElement('div');
    w.className = 'painted-word';
    w.textContent = text;
    paintedText.appendChild(w);
    return w;
  });

  waterTimer = setInterval(()=>spawnStreak(streaksEl), 90);

  setTimeout(()=>{
    words.forEach(w=>{
      w.style.animation = 'dissolve 1.5s ease-in forwards';
    });
  }, 500);

  setTimeout(()=>{
    clearInterval(waterTimer);
    onDone();
  }, 2500);
}

/* ---- iceblue theme runner ---- */
function runIceblue(items, onDone) {
  const orb = document.getElementById('glow-orb');
  const text = document.getElementById('glow-text');
  const wrap = document.getElementById('wrap-group');

  text.textContent = items.join(' ・ ') || '...';

  orb.style.transition = 'none';
  text.style.animation = 'none';
  text.style.filter = 'blur(0px)';
  orb.style.opacity = '0';
  text.style.opacity = '0';

  void wrap.offsetWidth;

  // テキストの実際の位置・大きさを測って、拭く経路を組み立てる
  const tRect = text.getBoundingClientRect();
  const wRect = wrap.getBoundingClientRect();
  const boxLeft = tRect.left - wRect.left;
  const boxRight = tRect.right - wRect.left;
  const boxTop = tRect.top - wRect.top;
  const boxBottom = tRect.bottom - wRect.top;
  const boxH = boxBottom - boxTop;

  const row1Y = boxTop + boxH * 0.3;
  const row2Y = boxTop + boxH * 0.72;
  const leftX = boxLeft - 10;
  const rightX = boxRight + 10;
  const startX = boxLeft - 60;

  // 開始位置（左上の少し外側）へ、アニメーションなしで一旦配置
  orb.style.left = startX + 'px';
  orb.style.top = row1Y + 'px';
  orb.style.opacity = '0';
  void orb.offsetWidth;

  // 経路: 左上へ入る→右(1行目)→下→左(2行目)→右(1行目、2周目)→下→左(2行目)
  // wipe:true の区間を通過するたびに、文字が少しずつ薄くなる
  const path = [
    { x: leftX,  y: row1Y, op: 1, dur: 420, wipe: false },
    { x: rightX, y: row1Y, op: 1, dur: 750, wipe: true  },
    { x: rightX, y: row2Y, op: 1, dur: 320, wipe: false },
    { x: leftX,  y: row2Y, op: 1, dur: 750, wipe: true  },
    { x: leftX,  y: row1Y, op: 1, dur: 320, wipe: false },
    { x: rightX, y: row1Y, op: 1, dur: 650, wipe: true  },
    { x: rightX, y: row2Y, op: 1, dur: 300, wipe: false },
    { x: leftX,  y: row2Y, op: 1, dur: 650, wipe: true  },
  ];

  const wipeSteps = path.filter(s => s.wipe).length; // 4回
  let wipeCount = 0;

  let t = 60;
  path.forEach((step)=>{
    setTimeout(()=>{
      orb.style.transition = 'left ' + (step.dur/1000) + 's ease-in-out, top ' + (step.dur/1000) + 's ease-in-out, opacity 0.4s ease-out';
      orb.style.left = step.x + 'px';
      orb.style.top = step.y + 'px';
      orb.style.opacity = String(step.op);

      if (step.wipe) {
        wipeCount++;
        const remain = Math.max(0, 1 - wipeCount / wipeSteps); // 1 -> 0.75 -> 0.5 -> 0.25 -> 0
        text.style.transition = 'opacity ' + (step.dur/1000) + 's ease-in-out, filter ' + (step.dur/1000) + 's ease-in-out';
        text.style.opacity = String(remain);
        text.style.filter = 'blur(' + ((1 - remain) * 3) + 'px)';
      }
    }, t);
    t += step.dur;
  });

  setTimeout(()=>{
    text.style.transition = 'opacity 0.6s ease-out';
    text.style.opacity = '1';
  }, 60);

  setTimeout(()=>{
    orb.style.transition = 'left 1.0s ease-in, top 1.0s ease-in, opacity 1.0s ease-in, transform 1.0s ease-in';
    orb.style.top = (row1Y - 170) + 'px';
    orb.style.opacity = '0';
    orb.style.transform = 'translate(-50%, -50%) scale(0.7)';
  }, t + 100);

  setTimeout(function () {
    orb.style.transform = 'translate(-50%, -50%) scale(1)';
    if (typeof onDone === 'function') {
      onDone();
    }
  }, t + 1200);
}

els.startBtn.addEventListener('click', ()=>{
  runSeq++;
  const myRun = runSeq;
  currentRun = myRun;

  const raw = els.thought.value;
  let items = raw.split(/[\n,、]/).map(s=>s.trim()).filter(Boolean);
  if(items.length === 0) items = [''];

  if(currentTheme === 'words'){
    els.wordsEcho.textContent = items.length > 1
      ? items.join(' ・ ') + ' を手放す'
      : (items[0] ? '「' + items[0] + '」を手放す' : '静かに手放す');
    els.wordsEcho.classList.remove('hidden');
  } else {
    els.wordsEcho.textContent = '';
    els.wordsEcho.classList.add('hidden');
  }

  els.screenInput.classList.add('hidden');
  els.screenClean.classList.remove('hidden');
  els.screenDone.classList.add('hidden');
  showStage(currentTheme);

  const done = () => finish(myRun);

  if(currentTheme === 'words') runWords(items, done);
  else if(currentTheme === 'bubble') runBubble(items, done);
  else if(currentTheme === 'water') runWater(items, done);
  else if(currentTheme === 'iceblue') runIceblue(items, done);
});

els.resetBtn.addEventListener('click', ()=>{
  els.thought.value = '';
  els.screenDone.classList.add('hidden');
  els.screenInput.classList.remove('hidden');
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
