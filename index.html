<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>クリーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --ib-1:#E6F4FB;
    --ib-2:#B9E1F2;
    --ib-3:#6EC1E4;
    --ib-4:#2E9BC9;
    --ib-deep:#125C7A;
    --text:#1E3A45;
    --sub:#5C7A85;
  }
  html,body{
    height:100%;
    font-family:'Noto Sans JP',sans-serif;
    background:linear-gradient(180deg,#F4FBFE 0%,#E6F4FB 100%);
    color:var(--text);
    overflow-x:hidden;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:20px 20px 40px;
  }
  header{
    text-align:center;
    padding:12px 0 20px;
  }
  header h1{
    font-size:20px;
    font-weight:700;
    color:var(--ib-deep);
    letter-spacing:1px;
  }
  header p{
    font-size:12px;
    color:var(--sub);
    margin-top:4px;
  }
  .theme-picker{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-bottom:24px;
  }
  .theme-btn{
    border:1.5px solid var(--ib-2);
    background:#fff;
    border-radius:14px;
    padding:10px 6px;
    font-size:12px;
    font-weight:500;
    color:var(--sub);
    cursor:pointer;
    transition:all .2s;
  }
  .theme-btn.active{
    border-color:var(--ib-4);
    background:var(--ib-1);
    color:var(--ib-deep);
    box-shadow:0 2px 8px rgba(46,155,201,0.25);
  }
  .card{
    background:#fff;
    border-radius:24px;
    box-shadow:0 4px 24px rgba(46,155,201,0.12);
    padding:32px 24px;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:420px;
    position:relative;
    overflow:hidden;
  }
  .screen{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .hidden{display:none !important;}

  .label{
    font-size:13px;
    color:var(--sub);
    margin-bottom:14px;
  }
  input#thought{
    width:100%;
    max-width:280px;
    border:1.5px solid var(--ib-2);
    border-radius:12px;
    padding:12px 14px;
    font-size:15px;
    text-align:center;
    font-family:inherit;
    color:var(--text);
    margin-bottom:20px;
    outline:none;
  }
  input#thought:focus{border-color:var(--ib-4);}
  button.primary{
    width:100%;
    max-width:280px;
    background:var(--ib-4);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    font-weight:500;
    font-family:inherit;
    cursor:pointer;
  }
  button.primary:active{transform:scale(0.98);}
  button.secondary{
    background:none;
    border:1.5px solid var(--ib-2);
    color:var(--ib-deep);
    border-radius:12px;
    padding:10px 24px;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
  }
  .thought-echo{
    font-size:12px;
    color:var(--sub);
    margin-bottom:18px;
    min-height:16px;
  }
  .done-title{
    font-size:14px;
    letter-spacing:2px;
    color:var(--sub);
    margin-bottom:4px;
  }
  .done-sub{
    font-size:22px;
    font-weight:700;
    color:var(--ib-deep);
    margin-bottom:24px;
  }
  .counter{
    font-size:11px;
    color:var(--sub);
    margin-top:18px;
  }

  /* ---- words theme ---- */
  .stamp-stage{
    width:220px;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .stamp-stage img{
    max-width:100%;
    max-height:100%;
    opacity:0;
    transition:opacity .5s ease;
    position:absolute;
  }
  .stamp-stage img.show{opacity:1;}

  /* ---- bubble theme ---- */
  @keyframes floatUp {
    0% { transform: translate(0,0) rotate(0deg); }
    30% { transform: translate(-10px,-60px) rotate(-3deg); }
    60% { transform: translate(8px,-115px) rotate(2deg); }
    100% { transform: translate(0,-170px) rotate(0deg); }
  }
  @keyframes popBurst {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(0.15); opacity: 0; }
  }
  .bubble-stage{
    position:relative;
    height:260px;
    width:100%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .bubble{
    position:relative;
    width:150px;
    height:150px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(110,193,228,0.25) 60%, rgba(46,155,201,0.15));
    border:1px solid var(--ib-3);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 18px;
    box-shadow:inset 0 0 20px rgba(255,255,255,0.6);
  }
  .bubble span{
    font-size:14px;
    color:var(--ib-deep);
    font-weight:500;
  }
  .bubble-particles{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  /* ---- water theme ---- */
  @keyframes streak {
    0% { transform: translateY(-60px); opacity: 0; }
    15% { opacity: 0.7; }
    85% { opacity: 0.5; }
    100% { transform: translateY(280px); opacity: 0; }
  }
  @keyframes dissolve {
    0% { filter: blur(0px); opacity: 1; transform: translateY(0); }
    100% { filter: blur(4px); opacity: 0; transform: translateY(36px); }
  }
  .water-stage{
    position:relative;
    height:260px;
    width:100%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .water-streaks{position:absolute; inset:0;}
  .painted-text{
    font-size:24px;
    font-weight:700;
    color:var(--ib-deep);
    font-family: 'Noto Sans JP', serif;
    position:relative;
    z-index:2;
  }

  /* ---- iceblue glow theme ---- */
  @keyframes glowPulse {
    0% { transform: scale(0.7); opacity:0; }
    40% { transform: scale(1.05); opacity:0.9; }
    70% { transform: scale(1); opacity:0.9; }
    100% { transform: scale(1.15); opacity:0.9; }
  }
  @keyframes glowDissolve {
    0% { transform: scale(1.15); opacity:0.9; filter:blur(0px); }
    100% { transform: scale(2.2); opacity:0; filter:blur(6px); }
  }
  @keyframes textFadeGlow {
    0% { opacity:0; }
    30% { opacity:1; }
    75% { opacity:1; }
    100% { opacity:0; }
  }
  .glow-stage{
    position:relative;
    height:260px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .glow-orb{
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(185,225,242,0.85) 35%, rgba(110,193,228,0.55) 65%, rgba(110,193,228,0) 100%);
    opacity:0;
  }
  .glow-text{
    position:relative;
    z-index:2;
    font-size:15px;
    color:var(--ib-deep);
    font-weight:500;
    opacity:0;
  }

  .dewdrop-mark{
    width:64px;
    height:74px;
    margin-bottom:16px;
  }

  /* ---- passcode gate ---- */
  #gate{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  #gate .dewdrop-mark{margin-bottom:20px;}
  #gate h2{
    font-size:17px;
    color:var(--ib-deep);
    margin-bottom:6px;
  }
  #gate p{
    font-size:12px;
    color:var(--sub);
    margin-bottom:20px;
  }
  #gate input{
    width:100%;
    max-width:260px;
    border:1.5px solid var(--ib-2);
    border-radius:12px;
    padding:12px 14px;
    font-size:15px;
    text-align:center;
    font-family:inherit;
    margin-bottom:12px;
    outline:none;
  }
  #gate input:focus{border-color:var(--ib-4);}
  #gate .error{
    font-size:12px;
    color:#D85A30;
    min-height:16px;
    margin-bottom:8px;
  }
</style>
</head>
<body>
<div id="gate">
  <svg class="dewdrop-mark" viewBox="0 0 100 110">
    <ellipse cx="50" cy="62" rx="34" ry="38" fill="var(--ib-1)" stroke="var(--ib-3)" stroke-width="1.5"/>
    <ellipse cx="38" cy="45" rx="5" ry="3.5" fill="#fff" opacity="0.9"/>
    <path d="M38 62 Q45 68 52 62" stroke="var(--ib-deep)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="32" cy="60" r="4" fill="#ED93B1" opacity="0.6"/>
    <circle cx="60" cy="60" r="4" fill="#ED93B1" opacity="0.6"/>
    <ellipse cx="52" cy="18" rx="10" ry="5" fill="#8BC34A" transform="rotate(-25 52 18)"/>
  </svg>
  <h2>クリーニング</h2>
  <p>合言葉を入力してください</p>
  <input id="passcode" type="text" placeholder="合言葉" autocomplete="off" />
  <p class="error" id="gate-error"></p>
  <button class="primary" id="gate-btn" style="max-width:260px;">入る</button>
</div>

<div id="app" class="hidden">
  <header>
    <h1>クリーニング</h1>
    <p>ホ・オポノポノで、今の気持ちを手放す</p>
  </header>

  <div class="theme-picker">
    <button class="theme-btn" data-theme="words">四つの言葉</button>
    <button class="theme-btn" data-theme="bubble">Blue bubble</button>
    <button class="theme-btn" data-theme="water">ブルーソーラーウォーター</button>
    <button class="theme-btn" data-theme="iceblue">Iceblue</button>
  </div>

  <div class="card">

    <div id="screen-input" class="screen">
      <p class="label">今、心にあるものを一言</p>
      <input id="thought" type="text" placeholder="例: 今日の焦り" />
      <button class="primary" id="start-btn">クリーニングする</button>
    </div>

      <p class="thought-echo" id="thought-echo"></p>

        <ellipse cx="50" cy="62" rx="34" ry="38" fill="var(--ib-1)" stroke="var(--ib-3)" stroke-width="1.5"/>
        <ellipse cx="38" cy="45" rx="5" ry="3.5" fill="#fff" opacity="0.9"/>
        <path d="M38 62 Q45 68 52 62" stroke="var(--ib-deep)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="32" cy="60" r="4" fill="#ED93B1" opacity="0.6"/>
        <circle cx="60" cy="60" r="4" fill="#ED93B1" opacity="0.6"/>
        <ellipse cx="52" cy="18" rx="10" ry="5" fill="#8BC34A" transform="rotate(-25 52 18)"/>
      </svg>
      <p class="done-title">AND IT IS DONE!</p>
      <p class="done-sub">完了です！</p>
      <button class="secondary" id="reset-btn">もう一度</button>
      <p class="counter" id="counter-text"></p>
    </div>

  </div>
</div>

<script>
/* 合言葉はここを書き換えてください（大文字小文字は区別しません） */
const PASSCODE = "わたしはわたし";

(function(){
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const input = document.getElementById('passcode');
  const btn = document.getElementById('gate-btn');
  const err = document.getElementById('gate-error');

  function unlock(){
    gate.classList.add('hidden');
    app.classList.remove('hidden');
  }

  if(localStorage.getItem('cleaning-auth') === 'true'){
    unlock();
  }

  function tryLogin(){
    const val = input.value.trim().toLowerCase();
    if(val === PASSCODE.toLowerCase()){
      localStorage.setItem('cleaning-auth', 'true');
      unlock();
    } else {
      err.textContent = '合言葉が違います';
      input.value = '';
      input.focus();
    }
  }
  btn.addEventListener('click', tryLogin);
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && !e.isComposing) tryLogin(); });
})();

const PHRASES = ["ごめんなさい","許してください","ありがとう","愛しています"];
const STAMP_IDS = ["img-sorry","img-forgive","img-thanks","img-love"];

let currentTheme = localStorage.getItem('cleaning-theme') || 'words';
let cleanCount = parseInt(localStorage.getItem('cleaning-count') || '0', 10);

const els = {
  themeBtns: document.querySelectorAll('.theme-btn'),
  screenInput: document.getElementById('screen-input'),
  screenClean: document.getElementById('screen-clean'),
  screenDone: document.getElementById('screen-done'),
  thought: document.getElementById('thought'),
  startBtn: document.getElementById('start-btn'),
  resetBtn: document.getElementById('reset-btn'),
  thoughtEcho: document.getElementById('thought-echo'),
  counterText: document.getElementById('counter-text'),
  stageWords: document.getElementById('stage-words'),
  stageBubble: document.getElementById('stage-bubble'),
  stageWater: document.getElementById('stage-water'),
  stageIceblue: document.getElementById('stage-iceblue'),
};

function setTheme(t){
  currentTheme = t;
  localStorage.setItem('cleaning-theme', t);
  els.themeBtns.forEach(b=>{
    b.classList.toggle('active', b.dataset.theme === t);
  });
}
els.themeBtns.forEach(b=>{
  b.addEventListener('click', ()=> setTheme(b.dataset.theme));
});
setTheme(currentTheme);

function showStage(name){
  [els.stageWords, els.stageBubble, els.stageWater, els.stageIceblue].forEach(s=>s.classList.add('hidden'));
  const map = {words: els.stageWords, bubble: els.stageBubble, water: els.stageWater, iceblue: els.stageIceblue};
  map[name].classList.remove('hidden');
}

function finish(){
  cleanCount += 1;
  localStorage.setItem('cleaning-count', String(cleanCount));
  setTimeout(()=>{
    els.screenClean.classList.add('hidden');
    els.screenDone.classList.remove('hidden');
    els.counterText.textContent = 'これまでに ' + cleanCount + ' 回クリーニングしました';
  }, 700);
}

/* ---- words theme runner ---- */
function runWords(){
  let i = 0;
  STAMP_IDS.forEach(id => document.getElementById(id).classList.remove('show'));
  function step(){
    if(i > 0) document.getElementById(STAMP_IDS[i-1]).classList.remove('show');
    if(i >= STAMP_IDS.length){ finish(); return; }
    document.getElementById(STAMP_IDS[i]).classList.add('show');
    i++;
    setTimeout(step, 1500);
  }
  step();
}

/* ---- bubble theme runner ---- */
function burst(cx, cy, container){
  for(let i=0;i<10;i++){
    const d = document.createElement('div');
    const angle = (Math.PI*2*i)/10;
    const dist = 45 + Math.random()*35;
    d.style.cssText = 'position:absolute; left:'+cx+'px; top:'+cy+'px; width:6px; height:6px; border-radius:50%; background:#2E9BC9; opacity:0.9; transition:transform .8s ease-out, opacity .8s ease-out;';
    container.appendChild(d);
    requestAnimationFrame(()=>{
      d.style.transform = 'translate('+Math.cos(angle)*dist+'px,'+Math.sin(angle)*dist+'px)';
      d.style.opacity = '0';
    });
    setTimeout(()=>d.remove(), 850);
  }
}
function runBubble(val){
  const bubbleEl = document.getElementById('bubble-el');
  const bubbleText = document.getElementById('bubble-text');
  const particles = document.getElementById('bubble-particles');
  const stage = document.getElementById('stage-bubble');
  particles.innerHTML = '';
  bubbleText.textContent = val || '...';
  bubbleEl.style.animation = 'none';
  void bubbleEl.offsetWidth;
  bubbleEl.style.opacity = '1';
  bubbleEl.style.animation = 'floatUp 2.6s ease-in-out forwards';

  setTimeout(()=>{
    const rect = stage.getBoundingClientRect();
    burst(rect.width/2, rect.height - 150 - 85, particles);
    bubbleEl.style.animation = 'popBurst 0.35s ease-out forwards';
  }, 2600);

  setTimeout(()=>{
    bubbleEl.style.opacity = '0';
    finish();
  }, 3300);
}

/* ---- water theme runner ---- */
let waterTimer = null;
function spawnStreak(container){
  const s = document.createElement('div');
  const x = 10 + Math.random()*(container.clientWidth-10);
  const w = 1 + Math.random()*1.8;
  s.style.cssText = 'position:absolute; top:-60px; left:'+x+'px; width:'+w+'px; height:70px; background:#2E9BC9; animation: streak 1.15s linear forwards;';
  container.appendChild(s);
  setTimeout(()=>s.remove(), 1200);
}
function runWater(val){
  const paintedText = document.getElementById('painted-text');
  const streaksEl = document.getElementById('water-streaks');
  streaksEl.innerHTML = '';
  paintedText.textContent = val || '...';
  paintedText.style.animation = 'none';
  paintedText.style.opacity = '1';
  void paintedText.offsetWidth;

  waterTimer = setInterval(()=>spawnStreak(streaksEl), 90);

  setTimeout(()=>{
    paintedText.style.animation = 'dissolve 1.5s ease-in forwards';
  }, 500);

  setTimeout(()=>{
    clearInterval(waterTimer);
    finish();
  }, 2500);
}

/* ---- iceblue theme runner ---- */
function runIceblue(val){
  const orb = document.getElementById('glow-orb');
  const text = document.getElementById('glow-text');
  text.textContent = val || '...';
  orb.style.animation = 'none';
  text.style.animation = 'none';
  void orb.offsetWidth;

  orb.style.animation = 'glowPulse 1.4s ease-out forwards';
  text.style.animation = 'textFadeGlow 1.9s ease-in-out forwards';

  setTimeout(()=>{
    orb.style.animation = 'glowDissolve 1.1s ease-in forwards';
  }, 1400);

  setTimeout(()=>{
    finish();
  }, 2700);
}

els.startBtn.addEventListener('click', ()=>{
  const val = els.thought.value.trim();
  els.thoughtEcho.textContent = val ? '「' + val + '」を手放す' : '静かに手放す';
  els.screenInput.classList.add('hidden');
  els.screenClean.classList.remove('hidden');
  els.screenDone.classList.add('hidden');
  showStage(currentTheme);

  if(currentTheme === 'words') runWords();
  else if(currentTheme === 'bubble') runBubble(val);
  else if(currentTheme === 'water') runWater(val);
  else if(currentTheme === 'iceblue') runIceblue(val);
});

els.resetBtn.addEventListener('click', ()=>{
  els.thought.value = '';
  els.screenDone.classList.add('hidden');
  els.screenInput.classList.remove('hidden');
});
</script>
</body>
</html>
